name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeuDinheiro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeuDinheiro-apk
          path: MeuDinheiro.apk
      - name: Publicar em Releases (link direto pro celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Meu Dinheiro (APK mais recente)
          files: MeuDinheiro.apk
